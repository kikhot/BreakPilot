agents:
  - id: breakpilot-debugger
    name: BreakPilot Debugger
    purpose: Runtime debugging for AI coding agents
    package: "@breakpilot/cli"
    mcp:
      server_identity: breakpilot-debugger
      command: breakpilot
      args: ["mcp", "serve"]
    cli:
      daemon: "breakpilot serve"
      control_url_env: BREAKPILOT_CONTROL_URL
      default_control_url: "http://127.0.0.1:57987"
    instructions: |
      Use BreakPilot when runtime facts are needed to resolve a coding task.
      Prefer MCP tools over CLI. MCP stdio proxies to the local hub; the hub also exposes Streamable HTTP at /stream, legacy SSE at /sse, and the IDE bridge at /bridge.
      First use bp_debug_start to attach, launch, or adopt an IDE session, set minimal breakpoints with bp_debug_set_breakpoint, wait with bp_debug_control(action="wait"), then inspect bp_debug_frame.
      Prefer bp_debug_value for targeted expansion. Use bp_debug_eval with mode readonly by default.
      Record observed file, line, frame, variables, and eval results before bp_debug_control(action="resume") or bp_debug_control(action="disconnect").
      Do not attach to production or unknown remote targets. Do not use unsafe eval without explicit user permission.
    environment:
      - BREAKPILOT_CONTROL_URL
      - BREAKPILOT_POLICY
      - BREAKPILOT_WORKSPACE
      - BREAKPILOT_PYTHON_ADAPTER
      - BREAKPILOT_JS_DEBUG_COMMAND
      - BREAKPILOT_JS_DEBUG_ARGS
      - BREAKPILOT_JAVA_ADAPTER_COMMAND
      - BREAKPILOT_JAVA_ADAPTER_ARGS
